# Add a [[test]] entry and a Startup-Sequence under startup/ to add coverage.

# Integration tests intentionally own their emulated machine definition. These
# options are not used by interactive amiga-workbench profiles or UAE configs.
[amiberry]
args = ["-w", "-1"]
settings = [
  "cpu_type=68020/68881",
  "cpu_model=68030",
  "fpu_model=68882",
  "cpu_compatible=true",
]

[[test]]
name = "checksumbench"
project = "apps"
app = "checksumbench"
environments = ["wb32", "wb31", "wb13"]
timeout = 600
activity_timeout = 600
no_activity_timeout = 120
startup = "startup/checksumbench.sequence"
completion_mode = "nio_marker"
completion_log = "host:/amiga-e2e-complete/checksumbench"
results = ["checksumbench.result"]

[test.environment_variants.wb13]
startup = "startup/checksumbench-wb13.sequence"
startup_target = "S/StartupII"
amiga_artifact_profile = "wb13"
core_tools = ["fls"]

[[test]]
name = "wifi-config"
project = "apps"
app = "wificonfigtest"
environments = ["wb32", "wb31", "wb13"]
startup = "startup/wifi-config.sequence"
completion_mode = "nio_marker"
