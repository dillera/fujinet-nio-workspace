[[test]]
name = "diskdevice-stalled-external-peer"
project = "apps"
app = "wifitest"
driver = true
environments = ["wb32", "wb31", "wb13"]
silent_peer = true
# This case does not launch a local fujinet-nio instance. It connects Amiberry
# to a fake external TCP peer that accepts the connection, emits a single SLIP
# delimiter, then stalls. The mount command must fail in bounded time and must
# not leave behind a successful mount result artifact.
# A real-speed A500 takes roughly 20 seconds to boot and load the residents;
# retain enough time for the three bounded 5-second transport attempts before
# expected_timeout ends the otherwise-idle guest run.
timeout = 60
activity_timeout = 45
screenshot_quiet = 2
screenshot_interval = 0.5
startup = "startup/diskdevice-silent-timeout.sequence"
completion_mode = "expected_timeout"
results = ["fmount.result", "stalled-peer-timeout.result"]

[test.environment_variants.wb32]
# The accelerated WB3.2 control reaches and completes the deliberate timeout
# well within this bound; expected_timeout is its completion signal because
# the peer intentionally cannot send an NIO marker.
timeout = 30
activity_timeout = 20

[test.environment_variants.wb13]
startup = "startup/diskdevice-silent-timeout-wb13.sequence"
startup_target = "S/StartupII"
amiga_artifact_profile = "wb13"
no_static_mountlists = true
defer_nio_load = true

