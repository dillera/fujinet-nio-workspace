[[test]]
name = "diskdevice-fumount-leak"
project = "apps"
app = "wifitest"
driver = true
# Repeated FMOUNT/use/FUMOUNT cycles on one unit, recording free memory and
# the fujinet-disk.device open count after each, to measure what a handler
# that cannot be retired (WB3.1 FFS has no ACTION_DIE) costs per cycle.
timeout = 240
activity_timeout = 200
screenshot_quiet = 15
screenshot_interval = 1.0
no_activity_timeout = 60
startup = "startup/diskdevice-fumount-leak.sequence"
completion_mode = "nio_marker"
completion_log = "host:/amiga-e2e-complete/diskdevice-fumount-leak"
results = [
  "leak-load.result",
  "leak-ops.result",
  "leak-cycles.result",
]

